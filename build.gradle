plugins { id 'java'; id 'net.minecraftforge.gradle' version '[6.0,6.2)' }
version = '1.0.0-r11'
group = 'cn.blockforge.taczpitch'
description = 'Client-side addon for Timeless and Classics Zero (TaCZ): burst pitch and volume falloff, a configurable replacement for TaCZ\'s own random gunshot pitch, also applied to shots heard from other players.'
base { archivesName = 'tacz_burst_pitch' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft { mappings channel: 'official', version: '1.20.1' }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.0' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
processResources {
    def props = [mod_id: 'tacz_burst_pitch', mod_name: 'TACZ Burst Pitch Falloff', mod_version: project.version,
                 minecraft_version: '1.20.1', forge_version: '47.4.0', tacz_version_range: '[1.0,)']
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('META-INF/mods.toml') { expand props }
}
jar.finalizedBy('reobfJar')
